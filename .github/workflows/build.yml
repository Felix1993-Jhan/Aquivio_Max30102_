name: Build MAX30102 Tester

# 這個 repo 的 Flutter 專案就在 repo 根,不在任何子資料夾裡
# → 不需要 paths 過濾,也不需要 working-directory,所有路徑從根算。
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════
  # (A) Windows 桌面 App
  # ══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    # ⏸ 暫時停用 —— 目前只需要 server 的產物,桌面 App 先不編。
    #    要恢復把這行 `if: false` 刪掉即可(job 定義完整保留)。
    if: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Enable Windows desktop
      run: flutter config --enable-windows-desktop

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze

    - name: Build Windows Release
      run: flutter build windows --release

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: MAX30102Tester-Windows
        path: build/windows/x64/runner/Release/
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # (B) Linux 桌面 App
  # ══════════════════════════════════════════════════════════════
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    # ⏸ 暫時停用 —— 目前只需要 server 的產物,桌面 App 先不編。
    #    要恢復把這行 `if: false` 刪掉即可(job 定義完整保留)。
    if: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Enable Linux desktop
      run: flutter config --enable-linux-desktop

    - name: Install dependencies
      run: flutter pub get

    - name: Build Linux Release
      run: flutter build linux --release

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: MAX30102Tester-Linux
        path: build/linux/x64/release/bundle/
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # (C) Linux AMD64 無頭 server(dart compile exe)
  # ══════════════════════════════════════════════════════════════
  # 注意:這個 job **不需要** GTK 那一整包桌面相依 —— server 是純 Dart,
  # 不連結 Flutter engine。它只需要 libserialport 這個 C 函式庫(FFI 用)。
  build-server:
    name: Build Linux Server (AMD64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install libserialport
      run: |
        sudo apt-get update
        sudo apt-get install -y libserialport-dev

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Compile server executable
      # server 只 import 純 Dart 核心(lib/main_mode/max30102_K2/ 扣掉 ui/)。
      # 這一步若失敗,幾乎都是 import 圖混進了 package:flutter 或 ui/。
      run: dart compile exe bin/max30102_server.dart -o max30102_server

    - name: Smoke test (feed mode)
      # 起 server → 打 /health → 餵一個合成封包 → 確認 /vitals 回得出來。
      # 不接串口,純粹驗證編出來的執行檔真的跑得動。
      run: |
        ./max30102_server --mode feed --port 8770 &
        SERVER_PID=$!
        sleep 2
        echo "--- /health ---"
        curl -fsS http://127.0.0.1:8770/health
        echo ""
        echo "--- /feed (一組合成樣本) ---"
        # 封包內容:40 71 31 09 00 06 | 60 EA 00(RED=60000) | 50 66 01(IR=91728) | 0E
        # 最後的 14(0x0E) 是 checksum:(0x100 - (前面總和 754 & 0xFF)) & 0xFF
        curl -fsS -X POST http://127.0.0.1:8770/feed \
          -H 'Content-Type: application/json' \
          -d '{"bytes":[64,113,49,9,0,6,96,234,0,80,102,1,14]}'
        echo ""
        echo "--- /vitals ---"
        curl -fsS http://127.0.0.1:8770/vitals
        echo ""
        kill $SERVER_PID

    - name: Test server API (進料模式互斥與端點行為)
      # 驗證「serial 模式下 POST /feed 回 409」等 API 規則。
      #
      # ⚠️ 這裡不用真串口,也不用 socat 虛擬 pty ——
      #    libserialport 只認實體 UART(它會查 /sys/class/tty/<name>/device,
      #    /dev/pts/* 沒有那個節點),用 pty 開埠必定回 errno=2。
      #    互斥規則本身是純邏輯,測試注入一個假的進料來源即可完整覆蓋。
      #
      # ⚠️ 這裡刻意**不跑** `flutter test`(全部):test/k2_replay_verify_test.dart
      #    目前是既有失敗(K2 演算法的容差問題,見 CLAUDE.md 已知問題),
      #    無條件跑全部會讓 CI 長紅、失去警示作用。
      run: flutter test test/server_api_test.dart test/k2_reset_on_finger_off_test.dart

    - name: Upload server artifact
      # if: always() —— smoke test 失敗不該連累產物。
      # 執行檔在 `Compile server executable` 那步就已經編好了,冒煙測試是額外的把關;
      # 沒有這一行的話,測試一紅就拿不到執行檔,徒增取用成本。
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: max30102-server-linux-amd64
        path: max30102_server
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # (D) macOS arm64(Apple Silicon)無頭 server —— **只在手動觸發時跑**
  # ══════════════════════════════════════════════════════════════
  # 給整合方在 MacBook 上測指夾用。dart compile exe 只能編出「執行它的那台」
  # 的作業系統,所以必須在 macOS runner 上編,Windows / Linux 產不出來。
  #
  # 只在 Actions 頁面按「Run workflow」時才跑(平常 push 不產出):
  #   · 私有 repo 的 macOS 分鐘數以 10 倍計費
  #   · 執行檔原則上暫不產出,需要時才手動編
  #
  # 與 (C) 同一份原始碼、同一個版本號,差別只在平台。
  # 不跑 flutter test —— 那些測試與平台無關,(C) 已經跑過。
  #
  # ── 產物裡放什麼(解壓就能用,不需要 Homebrew)──────────────────
  #   max30102_server       server
  #   libserialport.dylib   從 runner 的 Homebrew 取出,只依賴 macOS 內建元件
  #   run.sh / README.txt   packaging/macos/
  #
  # ⚠️ macOS **不會**在執行檔旁邊找函式庫(Windows 會)—— 這正是整合方第一次
  #    卡住的地方。所以要嘛用 run.sh,要嘛由啟動 server 的程式帶
  #    LIBSERIALPORT_PATH。server 程式本身不改。
  #
  # ⚠️ 打包成 tar.gz 再上傳:upload-artifact 的 zip **不保留執行權限**,
  #    直接上傳的話對方解開後 server 跟 run.sh 都不能執行。
  build-server-macos:
    name: Build macOS Server (arm64)
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Compile server executable
      run: |
        mkdir -p dist
        dart compile exe bin/max30102_server.dart -o dist/max30102_server

    - name: Bundle libserialport.dylib
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: |
        brew install libserialport
        # -L:Homebrew 的 libserialport.dylib 是符號連結,要複製實體檔案
        cp -L "$(brew --prefix libserialport)/lib/libserialport.dylib" dist/
        cp packaging/macos/run.sh packaging/macos/README.txt dist/
        chmod +x dist/max30102_server dist/run.sh
        echo "--- dylib 架構與相依(應為 arm64,只連到系統元件)---"
        file dist/libserialport.dylib
        otool -L dist/libserialport.dylib

    - name: Smoke test (feed mode)
      # feed 模式不開串口、不載入 libserialport,只驗證執行檔在 macOS 上跑得起來。
      run: |
        ./dist/max30102_server --version
        ./dist/max30102_server --mode feed --port 8770 &
        SERVER_PID=$!
        sleep 2
        echo "--- /health ---"
        curl -fsS http://127.0.0.1:8770/health
        echo ""
        echo "--- /feed (一組合成樣本) ---"
        curl -fsS -X POST http://127.0.0.1:8770/feed \
          -H 'Content-Type: application/json' \
          -d '{"bytes":[64,113,49,9,0,6,96,234,0,80,102,1,14]}'
        echo ""
        echo "--- /vitals ---"
        curl -fsS http://127.0.0.1:8770/vitals
        echo ""
        kill $SERVER_PID

    - name: Smoke test (bundled dylib loads via run.sh)
      # 對一個不存在的埠開 serial 模式:開埠一定失敗,但**失敗的原因**才是重點 ——
      # 必須是「開不了埠」,不能是「載入不了函式庫」。後者就是整合方遇過的那個錯。
      run: |
        ./dist/run.sh --mode serial --serial /dev/cu.does-not-exist --port 8771 > sp.log 2>&1 &
        SERVER_PID=$!
        sleep 3
        kill $SERVER_PID || true
        cat sp.log
        if grep -q 'Failed to load dynamic library' sp.log; then
          echo "::error::libserialport.dylib 沒有被載入"
          exit 1
        fi

    - name: Package
      if: always()
      run: |
        mv dist max30102-server-macos-arm64
        tar -czf max30102-server-macos-arm64.tar.gz max30102-server-macos-arm64

    - name: Upload server artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: max30102-server-macos-arm64
        path: max30102-server-macos-arm64.tar.gz
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # (E) Windows x64 無頭 server —— **只在手動觸發時跑**
  # ══════════════════════════════════════════════════════════════
  # 產物:max30102_server.exe + serialport.dll + README.txt
  #
  # Windows 會在執行檔所在的資料夾找 DLL,所以兩個檔案放一起就能用,
  # 不需要環境變數。
  #
  # serialport.dll 的來源:flutter_libserialport 套件裡附的 libserialport 原始碼
  # 與 CMake 設定(windows/libserialport/),這份設定不依賴 Flutter,可以單獨編。
  # 桌面 App 的 serialport.dll 也是同一份原始碼編出來的。
  #
  # CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded:靜態連結 C 執行階段 →
  # 目標電腦不需要先裝 Visual C++ 可轉散發套件。
  build-server-windows:
    name: Build Windows Server (x64)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Compile server executable
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        dart compile exe bin/max30102_server.dart -o dist/max30102_server.exe

    - name: Build serialport.dll
      run: |
        # 從 package_config.json 找到 flutter_libserialport 套件實際所在的路徑
        $cfg = Get-Content .dart_tool/package_config.json -Raw | ConvertFrom-Json
        $root = ($cfg.packages | Where-Object { $_.name -eq 'flutter_libserialport' }).rootUri
        $pkg = ([Uri]$root).LocalPath
        Write-Host "flutter_libserialport: $pkg"
        cmake -S "$pkg/windows/libserialport" -B build-sp -A x64 `
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        cmake --build build-sp --config Release
        Copy-Item build-sp/Release/serialport.dll dist/
        Copy-Item packaging/windows/README.txt dist/
        Get-ChildItem dist

    - name: Smoke test (feed mode)
      run: |
        ./dist/max30102_server.exe --version
        $p = Start-Process -FilePath ./dist/max30102_server.exe `
          -ArgumentList '--mode','feed','--port','8770' -PassThru -NoNewWindow
        Start-Sleep -Seconds 3
        Write-Host '--- /health ---'
        Invoke-RestMethod http://127.0.0.1:8770/health | ConvertTo-Json -Depth 5
        Write-Host '--- /feed (一組合成樣本) ---'
        Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8770/feed `
          -ContentType 'application/json' `
          -Body '{"bytes":[64,113,49,9,0,6,96,234,0,80,102,1,14]}' | ConvertTo-Json -Depth 5
        Write-Host '--- /vitals ---'
        Invoke-RestMethod http://127.0.0.1:8770/vitals | ConvertTo-Json -Depth 5
        Stop-Process $p

    - name: Smoke test (bundled serialport.dll loads)
      # 同 macOS:對不存在的埠開 serial 模式,失敗原因必須是開不了埠,不是載入不了 DLL。
      run: |
        $p = Start-Process -FilePath ./dist/max30102_server.exe `
          -ArgumentList '--mode','serial','--serial','COM99','--port','8771' `
          -PassThru -NoNewWindow -RedirectStandardOutput sp.log -RedirectStandardError sp.err
        Start-Sleep -Seconds 3
        Stop-Process $p -ErrorAction SilentlyContinue
        $log = (Get-Content sp.log, sp.err -Raw -ErrorAction SilentlyContinue) -join "`n"
        Write-Host $log
        if ($log -match 'Failed to load dynamic library') {
          Write-Host '::error::serialport.dll 沒有被載入'
          exit 1
        }

    - name: Upload server artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: max30102-server-windows-x64
        path: dist/
        retention-days: 30
